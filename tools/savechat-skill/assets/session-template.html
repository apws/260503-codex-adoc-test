<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #fff;
      --ink: #172033;
      --muted: #5d687b;
      --line: #d8deea;
      --accent: #143c5a;
      --accent-2: #b45f30;
      --code: #eef3f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 24px clamp(18px, 4vw, 48px);
      border-bottom: 5px solid var(--accent-2);
    }
    main {
      width: min(1120px, calc(100vw - 32px));
      margin: 24px auto 56px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { margin: 0; color: rgba(255, 255, 255, 0.82); }
    details {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 14px 0;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.07);
      overflow: hidden;
    }
    details[open] summary { border-bottom: 1px solid var(--line); }
    summary {
      cursor: pointer;
      padding: 13px 16px;
      color: var(--accent);
      font-weight: 700;
      list-style-position: inside;
    }
    .content { padding: 16px; }
    code {
      background: var(--code);
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-family: Consolas, "Cascadia Mono", "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    pre {
      margin: 12px 0;
      padding: 12px 14px;
      overflow: auto;
      background: var(--code);
      border-left: 5px solid var(--accent);
      font: 13px/1.45 Consolas, "Cascadia Mono", "Liberation Mono", monospace;
    }
    .note { color: var(--muted); font-size: 0.94em; }
    .time {
      display: inline-block;
      min-width: 5.5em;
      color: var(--accent-2);
      font-family: Consolas, "Cascadia Mono", "Liberation Mono", monospace;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <p class="sub">{{SUBTITLE}}</p>
  </header>
  <main>
    <p class="note">{{NOTE}}</p>
    {{SECTIONS}}
  </main>
</body>
</html>
